name: estulanches-chico

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./cozinha.sql:/docker-entrypoint-initdb.d/001-cozinha.sql:ro
    networks: [estu-interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    # Limites evitam que o banco monopolize os recursos do host.
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  app:
    build:
      context: .
      target: production
    env_file: .env
    ports:
      - "${HOST_PORT:-3000}:3000"
    networks: [estu-interna, estu-edge]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M

  tests:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks: [estu-interna]
    depends_on:
      db:
        condition: service_healthy
    profiles: [test]
    volumes:
      - ./rdm:/app/rdm
    command: ["npm", "run", "test:integration"]

volumes:
  postgres_data:

networks:
  estu-interna:
    driver: bridge
    internal: true
  # Rede externa apenas para publicar a interface da aplicação no host.
  estu-edge:
    driver: bridge
